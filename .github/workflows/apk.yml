name: apk

on:
  push:
    branches: [no-donate-banner]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prebuilt dependencies
        run: |
          chmod +x ./download-prebuilt-dependencies.sh ./bVNC/prepare_project.sh
          ./download-prebuilt-dependencies.sh
          ./bVNC/prepare_project.sh --skip-build libs nopath

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew :aRDP-app:assembleDebug --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          SRC=$(ls aRDP-app/build/outputs/apk/debug/*arm64-v8a*.apk)
          OUT="$RUNNER_TEMP/ardp-arm64-v8a.apk"
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$OUT" "$SRC"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$OUT" | head -3
          rm -f "$RUNNER_TEMP/release.jks"
          echo "SIGNED_APK=$OUT" >> "$GITHUB_ENV"

      - name: Publish release (signed arm64 APK)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "$SIGNED_APK" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "aRDP no-banner #${{ github.run_number }}" \
            --notes "Signed build, branch ${{ github.ref_name }}, commit ${{ github.sha }}"