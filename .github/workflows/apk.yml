name: apk

on:
  push:
    branches: [no-donate-banner]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prebuilt dependencies
        run: |
          chmod +x ./download-prebuilt-dependencies.sh ./bVNC/prepare_project.sh
          ./download-prebuilt-dependencies.sh
          ./bVNC/prepare_project.sh --skip-build libs nopath

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew :aRDP-app:assembleDebug --stacktrace

      - name: Publish release (arm64 APK)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la aRDP-app/build/outputs/apk/debug/
          APK=$(ls aRDP-app/build/outputs/apk/debug/*arm64-v8a*.apk)
          gh release create "build-${{ github.run_number }}" "$APK" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "aRDP no-banner #${{ github.run_number }}" \
            --notes "Debug build, branch ${{ github.ref_name }}, commit ${{ github.sha }}"